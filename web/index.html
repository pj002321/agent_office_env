<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Agent Office</title>
<link rel="stylesheet" href="../node_modules/@fontsource/jua/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource/gowun-dodum/index.css">
<style>
  :root {
    --ink: #4a3a2e; --ink-soft: #7a6352; --line: #eadfce;
    --leaf: #287a41; --leaf-soft: #e3f4e4; --coral: #d9533d; --coral-soft: #ffe6df;
    --butter: #ffd45e; --brass: #f2cf72; --teal: #25786f; --teal-deep: #1c625b;
    --card: #ffffff; --shadow: 0 6px 18px rgba(74, 58, 46, .16), 0 2px 4px rgba(74, 58, 46, .10);
    --display: 'Jua', sans-serif; --body: 'Gowun Dodum', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font: 15px/1.5 var(--body); color: var(--ink); background: linear-gradient(var(--sky-top, #93d3f2) 0%, var(--sky-mid, #c4ebf7) 48%, var(--sky-bot, #ffe4cf) 100%); caret-color: var(--leaf); }
  ::selection { background: var(--butter); color: var(--ink); }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; border: 3px solid var(--card); }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; border-radius: 12px; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  #stage { position: fixed; inset: 0; }
  .labels { position: absolute; inset: 0; pointer-events: none; }

  /* ---------- in-world labels ---------- */
  .tag { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .tag .name { display: flex; align-items: center; gap: 4px; background: var(--card); border-radius: 10px; padding: 1px 4px 1px 8px; box-shadow: 0 2px 5px rgba(74,58,46,.18); font: 13px var(--display); white-space: nowrap; }
  .rank { font: 11px var(--display); font-style: normal; border-radius: 7px; padding: 0 5px; color: var(--ink); }
  .r-대표 { background: var(--butter); } .r-팀장 { background: #cddcfb; } .r-대리 { background: #cdeccd; } .r-사원 { background: #ffd9e1; }
  .bubble { position: relative; max-width: 240px; background: var(--card); border-radius: 14px; padding: 6px 11px; font-size: 13px; line-height: 1.4; box-shadow: var(--shadow);
            opacity: 0; transform: translateY(6px) scale(.9); transition: opacity .2s, transform .25s cubic-bezier(.2,1.4,.4,1); }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: var(--card); }
  .bubble.on { opacity: 1; transform: none; }
  .bubble.ask { background: var(--coral); color: #fff; font-weight: 700; }
  .bubble.ask::after { border-top-color: var(--coral); }
  .bubble.auto { background: var(--leaf-soft); color: #1f6b3a; }
  .bubble.auto::after { border-top-color: var(--leaf-soft); }
  .doing, .bubble { display: flex; align-items: center; gap: 4px; }
  .doing svg, .bubble svg, .ask p svg, #journal .txt svg { width: 14px; height: 14px; stroke-width: 2.2; vertical-align: -2px; margin-right: 4px; }
  .bubble { display: block; }
  .doing { font-size: 12px; color: #1f6b3a; background: rgba(227, 244, 228, .92); border-radius: 8px; padding: 0 7px; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .doing:empty { display: none; }
  .floor-sign { pointer-events: auto; display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 18px; padding: 4px 10px 4px 4px; box-shadow: var(--shadow); font: 15px var(--display); transition: transform .2s; }
  .floor-sign:hover { transform: translateX(4px); }
  .floor-sign .fl { background: var(--brass); border-radius: 50%; width: 34px; height: 34px; display: grid; place-items: center; }
  .floor-sign .st { font: 12px var(--body); font-weight: 700; border-radius: 8px; padding: 1px 7px; background: #eef2f4; color: var(--ink-soft); }
  .floor-sign .st[data-state="busy"] { background: var(--leaf-soft); color: var(--leaf); }
  .floor-sign .st[data-state="ask"] { background: var(--coral-soft); color: var(--coral); }
  .alert-balloon { width: 40px; height: 40px; border-radius: 50%; background: var(--coral); color: #fff; font: 22px var(--display); display: grid; place-items: center; box-shadow: var(--shadow); animation: hop 1s infinite cubic-bezier(.3,0,.3,1); }
  @keyframes hop { 0%, 100% { translate: 0 0; } 45% { translate: 0 -10px; } }

  /* ---------- elevator panel ---------- */
  #elevator { position: fixed; left: 16px; top: 16px; bottom: 16px; width: 228px; display: flex; flex-direction: column; background: var(--teal); border-radius: 26px; padding: 14px 12px; box-shadow: var(--shadow); color: #fff; }
  #elevator h1 { font: 22px var(--display); margin: 2px 6px 12px; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
  #elevator h1 svg { width: 22px; height: 22px; }
  #clock { display: flex; align-items: center; gap: 10px; margin: 0 2px 12px; padding: 8px 12px; border-radius: 16px; background: var(--teal-deep); }
  #clock-icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--butter); color: #8a5a00; flex: none; }
  #clock[data-icon="moon"] #clock-icon { background: #3b4a8a; color: #fff3c4; }
  #clock-time { font: 22px var(--display); display: block; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #clock-date { font-size: 12px; opacity: .85; display: block; }
  #floor-list { list-style: none; margin: 0; padding: 4px; flex: 1; overflow: hidden auto; display: flex; flex-direction: column; gap: 6px; background: var(--teal-deep); border-radius: 18px; }
  #floor-list li { position: relative; }
  .floor-btn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 7px; border-radius: 14px; color: #fff; text-align: left; transition: background .15s; }
  .floor-btn:hover { background: rgba(255,255,255,.12); }
  .floor-btn.on { background: #fff; color: var(--ink); }
  .floor-btn .num { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--brass); color: var(--ink); display: grid; place-items: center; font: 15px var(--display); box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
  .floor-btn.lobby .num { background: #fff3dc; }
  .floor-btn .nm { flex: 1; min-width: 0; font: 16px var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lamp { flex: none; width: 11px; height: 11px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .floor-btn.on .lamp { background: #d7dcdf; }
  .lamp[data-state="busy"] { background: #8ff0a4 !important; box-shadow: 0 0 0 3px rgba(143,240,164,.35); }
  .lamp[data-state="ask"] { background: #ff9c88 !important; box-shadow: 0 0 0 3px rgba(255,156,136,.4); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .4; } }
  .del { position: absolute; right: 6px; top: 50%; translate: 0 -50%; opacity: 0; background: var(--card); color: var(--coral); border-radius: 10px; padding: 5px; box-shadow: var(--shadow); font: 12px var(--display); transition: opacity .15s; }
  .del svg { width: 15px; height: 15px; }
  #floor-list li:hover .del, .del.armed, .del:focus-visible { opacity: 1; }
  .del.armed { background: var(--coral); color: #fff; padding: 5px 8px; }
  #add-floor { margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px; border-radius: 16px; background: var(--brass); color: var(--ink); font: 16px var(--display); box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); transition: transform .15s; }
  #add-floor:hover { transform: translateY(-1px); }

  /* ---------- plaque ---------- */
  #plaque { position: fixed; top: 16px; left: calc(260px + (100vw - 606px) / 2); translate: -50% 0; display: flex; align-items: center; gap: 14px; background: #8a5a3c; color: #fff3dc; border-radius: 20px; padding: 8px 8px 8px 20px; box-shadow: var(--shadow); max-width: calc(100vw - 640px); }
  #plaque div { min-width: 0; }
  #plaque-name { font: 20px var(--display); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #plaque-path { font-size: 12px; opacity: .8; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #leave { display: flex; align-items: center; gap: 6px; background: #fff3dc; color: #6b4229; border-radius: 14px; padding: 8px 12px; font: 14px var(--display); white-space: nowrap; }

  /* ---------- right column ---------- */
  #side { position: fixed; right: 16px; top: 16px; bottom: 16px; width: 330px; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
  #side > * { pointer-events: auto; }
  #asks { display: flex; flex-direction: column; gap: 10px; }
  .ask { background: var(--card); border-radius: 20px; padding: 13px 15px; box-shadow: var(--shadow); border: 3px solid var(--coral); animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  .ask header { font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .ask header b { font: 16px var(--display); font-weight: normal; }
  .ask p { margin: 6px 0 10px; font-size: 14px; color: var(--ink); overflow-wrap: anywhere; }
  .ask footer { display: flex; gap: 6px; }
  .ask footer button { border-radius: 12px; padding: 7px 16px; font: 15px var(--display); display: flex; align-items: center; gap: 2px; }
  .yes { background: var(--leaf); color: #fff; }
  .no { background: #f3ede4; }
  .visit { margin-left: auto; color: var(--teal-deep); padding-right: 8px !important; }
  .chip { font: 12px var(--display); background: #fff3dc; color: #8a5a3c; border-radius: 8px; padding: 1px 7px; margin-right: 4px; }
  #journal { flex: 0 1 auto; max-height: 46vh; min-height: 0; display: flex; flex-direction: column; background: rgba(255,255,255,.94); border-radius: 22px; box-shadow: var(--shadow); padding: 14px 6px 8px 16px; }
  #journal-title { font: 18px var(--display); margin: 0 0 8px; }
  #journal ol { list-style: none; margin: 0; padding: 0 8px 0 0; overflow: auto; font-size: 13px; }
  #journal li { display: grid; grid-template-columns: 40px 1fr; column-gap: 6px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  #journal li.none { display: block; color: var(--ink-soft); border: 0; padding: 4px 0; }
  #journal time { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  #journal .who { font-family: var(--display); }
  #journal .who::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #c9d3d8; margin-right: 6px; translate: 0 -1px; }
  #journal .txt { grid-column: 2; color: var(--ink-soft); overflow-wrap: anywhere; }
  #journal li[data-tone="work"] .who::before { background: #8fc0ef; }
  #journal li[data-tone="hire"] .who::before { background: var(--butter); }
  #journal li[data-tone="ask"] .who::before, #journal li[data-tone="no"] .who::before { background: var(--coral); }
  #journal li[data-tone="ok"] .who::before, #journal li[data-tone="done"] .who::before { background: #5fb873; }
  #journal li[data-tone="order"] .who::before { background: #8a5a3c; }

  /* ---------- order bar ---------- */
  #order { position: fixed; left: calc(260px + (100vw - 606px) / 2); bottom: 18px; translate: -50% 0; width: min(640px, calc(100vw - 650px)); background: var(--card); border-radius: 24px; padding: 10px 10px 10px 18px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; align-items: end; column-gap: 10px; }
  #order::after { content: ''; position: absolute; left: 34px; top: -9px; border: 10px solid transparent; border-top: 0; border-bottom-color: var(--card); }
  #order .head { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 2px; }
  #to { font: 14px var(--display); color: var(--teal-deep); }
  #approve-mode { display: flex; background: #f3ede4; border-radius: 12px; padding: 3px; gap: 2px; }
  #approve-mode button { display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 9px; color: var(--ink-soft); font: 13px var(--display); white-space: nowrap; }
  #approve-mode button svg { width: 15px; height: 15px; }
  #approve-mode button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(74,58,46,.18); }
  #approve-mode button[data-auto="1"][aria-pressed="true"] { background: var(--butter); color: #5a3b00; }
  #task { font: 15px/1.45 var(--body); color: var(--ink); border: 0; outline: 0; resize: none; background: none; padding: 4px 0; height: 46px; }
  #task::placeholder { color: #a8968a; }
  #order .acts { display: flex; gap: 6px; }
  #go, #stop { display: flex; align-items: center; gap: 6px; border-radius: 16px; padding: 11px 18px; font: 16px var(--display); }
  #go { background: var(--leaf); color: #fff; }
  #stop { background: #f3ede4; }
  #order[data-mode="outside"] { display: none; }
  #hint { position: fixed; left: calc(260px + (100vw - 606px) / 2); bottom: 22px; translate: -50% 0; background: rgba(255,255,255,.92); border-radius: 18px; padding: 9px 18px; box-shadow: var(--shadow); font: 15px var(--display); color: var(--ink-soft); white-space: nowrap; }
  #order[data-mode="ready"] #stop, #order[data-mode="busy"] #go { display: none; }

  /* ---------- empty ---------- */
  #empty { position: fixed; left: 50%; top: 44%; translate: -50% -50%; width: 360px; text-align: center; background: var(--card); border-radius: 26px; padding: 26px 26px 22px; box-shadow: var(--shadow); }
  #empty h2 { font: 24px var(--display); margin: 0 0 6px; }
  #empty p { margin: 0 0 16px; color: var(--ink-soft); }
  #empty button { background: var(--leaf); color: #fff; border-radius: 16px; padding: 12px 20px; font: 17px var(--display); display: inline-flex; gap: 6px; align-items: center; }
  /* ---------- toasts ---------- */
  #toasts { position: fixed; top: 96px; left: calc(260px + (100vw - 606px) / 2); translate: -50% 0; width: min(440px, calc(100vw - 650px)); display: flex; flex-direction: column; gap: 10px; z-index: 5; }
  .toast { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border-radius: 22px; padding: 14px 16px; box-shadow: var(--shadow); animation: drop .45s cubic-bezier(.2,1.4,.4,1); transition: opacity .25s, translate .25s; }
  .toast.bye { opacity: 0; translate: 0 -12px; }
  @keyframes drop { from { translate: 0 -24px; opacity: 0; } }
  .toast .badge { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--brass); color: #6b4a00; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
  .toast .badge svg { width: 24px; height: 24px; }
  .toast.waiting .badge { animation: wiggle 1.2s infinite ease-in-out; }
  @keyframes wiggle { 50% { rotate: -14deg; } }
  .toast.done .badge { background: var(--leaf); color: #fff; }
  .toast.info .badge { background: var(--butter); }
  .toast h3 { margin: 2px 0 2px; font: 18px var(--display); font-weight: normal; }
  .toast p { margin: 0; font-size: 14px; color: var(--ink-soft); overflow-wrap: anywhere; }
  .toast footer { display: flex; gap: 6px; margin-top: 10px; }
  .toast footer:empty { display: none; }
  .toast footer button { border-radius: 12px; padding: 7px 14px; font: 15px var(--display); }
  [hidden] { display: none !important; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../node_modules/three/build/three.module.js",
  "three/addons/": "../node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>

<nav id="elevator" aria-label="층 이동">
  <h1 data-icon="out">Agent Office</h1>
  <div id="clock"><span id="clock-icon"></span><div><span id="clock-time"></span><span id="clock-date"></span></div></div>
  <ol id="floor-list"></ol>
  <button id="add-floor" data-icon="plus">새 층 올리기</button>
</nav>

<div id="plaque" hidden>
  <div><span id="plaque-name"></span><span id="plaque-path"></span></div>
  <button id="leave" data-icon="out">건물 밖으로</button>
</div>

<aside id="side">
  <div id="asks" aria-live="polite"></div>
  <section id="journal"><h2 id="journal-title">건물 전체 일지</h2><ol></ol></section>
</aside>

<form id="order" data-mode="outside">
  <div class="head">
    <label id="to" for="task"></label>
    <div id="approve-mode" role="group" aria-label="이 층의 승인 방식">
      <button type="button" data-auto="0" data-icon="hand" title="파일 수정·명령 실행 전에 매번 물어봐요">직접 승인</button>
      <button type="button" data-auto="1" data-icon="bolt" title="묻지 않고 바로 허락해요">자동 승인</button>
    </div>
  </div>
  <textarea id="task" rows="2" autocomplete="off"></textarea>
  <div class="acts">
    <button id="stop" type="button" data-icon="stop">멈추기</button>
    <button id="go" data-icon="send">맡기기</button>
  </div>
</form>

<div id="toasts" aria-live="polite"></div>

<div id="hint">층을 누르면 안으로 들어가 팀장에게 일을 맡길 수 있어요</div>

<div id="empty" hidden>
  <h2>아직 입주한 팀이 없어요</h2>
  <p>프로젝트 폴더를 고르면 그 프로젝트의 층이 올라가고, 팀장이 출근해요.</p>
  <button id="empty-add" data-icon="plus">첫 층 올리기</button>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
