<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Agent Office</title>
<style>
  body { margin: 0; overflow: hidden; font-family: system-ui, "Malgun Gothic", sans-serif; background: #cfe3f0; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .tag { text-align: center; font-size: 12px; color: #333; }
  .tag b { background: #fff; padding: 1px 7px; border-radius: 8px; box-shadow: 0 1px 3px #0003; white-space: nowrap; }
  .tag small { color: #666; margin-left: 3px; }
  .bubble { display: none; background: #fff; border-radius: 10px; padding: 4px 9px; margin-bottom: 5px; max-width: 200px; box-shadow: 0 2px 6px #0003; }
  .bar { display: none; width: 60px; height: 6px; background: #0002; border-radius: 3px; margin: 0 auto 5px; }
  .bar i { display: block; height: 100%; width: 0; background: #4caf50; border-radius: 3px; }
  #ui { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 8px; }
  #ui input { width: 380px; padding: 11px 16px; border-radius: 22px; border: none; font-size: 15px; box-shadow: 0 2px 8px #0003; }
  #ui button { padding: 0 20px; border-radius: 22px; border: none; background: #ff7043; color: #fff; font-size: 15px; cursor: pointer; }
  #log { position: fixed; right: 12px; top: 12px; width: 290px; max-height: 60vh; overflow: auto; background: #fffd; border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.5; }
  #log h3 { margin: 0 0 6px; font-size: 14px; }
  #log time { color: #999; margin-right: 4px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="log"><h3>📋 업무 로그</h3></div>
<form id="ui"><input id="task" placeholder="대표님께 업무 지시 (예: 신규 랜딩페이지 만들기)" autocomplete="off"><button>지시하기</button></form>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ---------- scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe3f0);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 17, 17);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.setSize(innerWidth, innerHeight);
labels.domElement.id = 'labels';
document.body.appendChild(labels.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.maxPolarAngle = Math.PI / 2.2;
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(8, 16, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15 });
scene.add(sun);

const mat = c => new THREE.MeshStandardMaterial({ color: c });
const V = (x, z) => new THREE.Vector3(x, 0, z);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function mesh(geo, color, x, y, z, parent = scene) {
  const m = new THREE.Mesh(geo, mat(color));
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true;
  parent.add(m); return m;
}
const box = (w, h, d, c, x, y, z) => mesh(new THREE.BoxGeometry(w, h, d), c, x, y, z);

// ---------- office ----------
box(24, 0.2, 18, 0xf3e9dc, 0, -0.1, 0);          // floor
box(24, 3, 0.2, 0xffffff, 0, 1.5, -9);           // back wall
box(0.2, 3, 18, 0xffffff, -12, 1.5, 0);          // left wall
box(10, 0.02, 4.5, 0xa8d5ba, 0, 0.01, 6);        // lounge rug
box(7, 0.02, 7, 0xd0e4ff, -6, 0.01, -1);         // 개발팀 area
box(7, 0.02, 7, 0xffd9e6, 6, 0.01, -1);          // 디자인팀 area
box(5, 0.02, 2.5, 0xfff1b8, 0, 0.01, -7.6);      // 대표 area
box(0.8, 1.3, 0.6, 0x6d4c41, -10.5, 0.65, 8);    // coffee machine
for (const [x, z] of [[-11, -8], [11, -8], [10.5, 8], [-3, 8]]) {   // plants
  mesh(new THREE.CylinderGeometry(0.3, 0.25, 0.5), 0xb5651d, x, 0.25, z);
  mesh(new THREE.SphereGeometry(0.55, 16, 12), 0x5cb85c, x, 0.95, z);
}
// s = +1: seat on +z side facing -z, s = -1: seat on -z side facing +z
function desk(x, z, s) {
  box(1.4, 0.08, 0.8, 0xd7b98e, x, 0.75, z);
  box(1.2, 0.7, 0.6, 0xc9a77a, x, 0.35, z);
  return box(0.65, 0.42, 0.05, 0x222222, x, 1.05, z - s * 0.25);   // monitor
}

// ---------- agents ----------
const RANK_COLOR = { 대표: 0xffc107, 팀장: 0x42a5f5, 대리: 0x66bb6a, 사원: 0xf48fb1 };
const HAIR = [0x3e2723, 0x5d4037, 0x212121, 0x8d6e63, 0xffb74d];
const LANE = -1;   // walkway between manager row and staff row
const agents = [];

function makeAgent(name, rank, team, dx, dz, s) {
  const screen = desk(dx, dz, s);
  const g = new THREE.Group();
  mesh(new THREE.CapsuleGeometry(0.28, 0.3, 4, 12), RANK_COLOR[rank], 0, 0.45, 0, g);
  const head = new THREE.Group(); head.position.y = 1.05; g.add(head);
  mesh(new THREE.SphereGeometry(0.33, 24, 16), 0xffe0bd, 0, 0, 0, head);
  const hair = mesh(new THREE.SphereGeometry(0.35, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2.3), HAIR[agents.length % HAIR.length], 0, 0.03, -0.02, head);
  hair.rotation.x = -0.35;
  for (const ex of [-0.11, 0.11]) {
    mesh(new THREE.SphereGeometry(0.045, 8, 8), 0x222222, ex, 0.02, 0.3, head);
    mesh(new THREE.SphereGeometry(0.05, 8, 8), 0xff9e9e, ex * 1.7, -0.08, 0.26, head);   // blush
  }
  if (rank === '대표') mesh(new THREE.ConeGeometry(0.18, 0.3, 5), 0xffd700, 0, 0.45, 0, head);   // crown

  const el = document.createElement('div');
  el.className = 'tag';
  el.innerHTML = `<div class="bubble"></div><div class="bar"><i></i></div><b>${name}<small>${rank}${team ? ' · ' + team : ''}</small></b>`;
  const label = new CSS2DObject(el); label.position.y = 1.75; g.add(label);

  const seat = V(dx, dz + s * 0.8);
  g.position.copy(seat);
  g.rotation.y = s > 0 ? Math.PI : 0;
  scene.add(g);
  const a = { name, rank, team, g, head, screen, seat, seatRot: g.rotation.y, path: [], busy: false, work: null,
              idleT: 2 + Math.random() * 6, bubble: el.querySelector('.bubble'), bar: el.querySelector('.bar'), fill: el.querySelector('.bar i') };
  agents.push(a);
  return a;
}

const ceo = makeAgent('하루', '대표', '', 0, -7.6, -1);
const teams = [['개발팀', -6, ['도윤', '대리'], ['하은', '사원'], ['시우', '사원'], '민준'],
               ['디자인팀', 6, ['지우', '대리'], ['유나', '사원'], ['준호', '사원'], '서연']];
const managers = teams.map(([team, x, ...rest]) => {
  const m = makeAgent(rest[3], '팀장', team, x, -3.5, 1);
  m.staff = rest.slice(0, 3).map(([n, r], i) => makeAgent(n, r, team, x + (i - 1) * 2, 1.5, -1));
  return m;
});

// ---------- movement / actions ----------
// ponytail: fixed waypoint routing via LANE and the center aisle, no real pathfinding; add A* if the layout grows
const inLounge = p => p.z > 2.5;
function route(a, b) {
  if (inLounge(a) && inLounge(b)) return [b];
  const pts = inLounge(a) ? [V(0, 3), V(0, LANE)] : [V(a.x, LANE)];
  pts.push(...(inLounge(b) ? [V(0, LANE), V(0, 3)] : [V(b.x, LANE)]), b);
  return pts;
}
function go(a, dest, look) {
  return new Promise(done => {
    a.path = route(a.g.position, dest);
    a.look = dest === a.seat ? a.seatRot : look;
    a.arrive = done;
  });
}
const face = (a, b) => a.g.rotation.y = Math.atan2(b.g.position.x - a.g.position.x, b.g.position.z - a.g.position.z);
function say(a, text, ms = 2200) {
  a.bubble.textContent = text; a.bubble.style.display = 'block';
  clearTimeout(a.sayT); a.sayT = setTimeout(() => a.bubble.style.display = 'none', ms);
  return sleep(ms);
}
function work(a, sec) {
  a.bar.style.display = 'block';
  return new Promise(done => a.work = { t: 0, dur: sec, done });
}
async function hire(list) {   // wait for the first free agent in list
  let a;
  while (!(a = list.find(x => !x.busy))) await sleep(300);
  a.busy = true;
  return a;
}

const logEl = document.getElementById('log');
function log(msg) {
  const d = document.createElement('div');
  d.innerHTML = `<time>${new Date().toLocaleTimeString('ko-KR', { hour12: false })}</time>${msg}`;
  logEl.insertBefore(d, logEl.children[1]);
}

// ---------- task flow: 대표 → 팀장 → 대리/사원 → 팀장 → 대표 ----------
async function runTask(text) {
  log(`📥 지시: "${text}"`);
  await say(ceo, `"${text}" 진행합시다!`);
  const mgr = await hire(managers);
  log(`👔 ${mgr.team} ${mgr.name} 팀장 배정`);
  await go(mgr, V(Math.sign(mgr.seat.x) * 0.7, -6.6)); face(mgr, ceo);
  await say(ceo, `${mgr.name} 팀장님, 부탁해요.`);
  await say(mgr, '넵! 바로 진행하겠습니다 🫡');
  await go(mgr, mgr.seat);
  await say(mgr, '업무 분배 중... 📝', 1500);

  const subs = ['자료 조사', '초안 작성', '검토·정리'];
  await Promise.all(subs.map(async (sub, i) => {
    const s = await hire(mgr.staff);
    const spot = V(mgr.seat.x + (i - 1) * 0.8, -1.7);
    await go(s, spot); face(s, mgr); face(mgr, s);
    await say(mgr, `${s.name}님, ${sub} 부탁해요`);
    say(s, '알겠습니다!');
    await go(s, s.seat);
    log(`💻 ${s.name} ${s.rank}: ${sub} 시작`);
    await work(s, 4 + Math.random() * 6);
    await go(s, spot); face(s, mgr); face(mgr, s);
    await say(s, `${sub} 완료했습니다! 📄`);
    log(`✅ ${s.name} ${s.rank}: ${sub} 완료`);
    s.busy = false; go(s, s.seat);
  }));

  mgr.g.rotation.y = mgr.seatRot;
  await say(mgr, '결과 취합 중...', 500);
  await work(mgr, 3);
  await go(mgr, V(Math.sign(mgr.seat.x) * 0.7, -6.6)); face(mgr, ceo);
  await say(mgr, `"${text}" 완료 보고드립니다!`);
  await say(ceo, '수고했어요! 👏');
  log(`🎉 완료: "${text}"`);
  mgr.busy = false; go(mgr, mgr.seat);
}

document.getElementById('ui').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('task');
  if (input.value.trim()) runTask(input.value.trim());
  input.value = '';
});

// ---------- loop ----------
const SPEED = 2.2;
const CHAT = ['☕ 커피 한잔~', '오늘 점심 뭐 먹지?', '스트레칭~ 🙆', '주말 언제 와...', '🎵'];
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  for (const a of agents) {
    const p = a.g.position;
    a.head.position.y = 1.05;
    if (a.path.length) {
      const d = a.path[0].clone().sub(p); d.y = 0;
      const dist = d.length(), step = SPEED * dt;
      if (dist <= step) {
        p.copy(a.path.shift());
        if (!a.path.length) { if (a.look !== undefined) a.g.rotation.y = a.look; a.arrive(); }
      } else {
        p.addScaledVector(d.normalize(), step);
        a.g.rotation.y = Math.atan2(d.x, d.z);
        p.y = Math.abs(Math.sin(t * 11)) * 0.08;   // walk bounce
      }
    } else if (a.work) {
      const w = a.work; w.t += dt;
      a.head.position.y = 1.05 + Math.sin(t * 22) * 0.02;   // typing nod
      a.screen.material.emissive.setHex(0x3399ff).multiplyScalar(0.6 + Math.random() * 0.2);
      a.fill.style.width = Math.min(100, w.t / w.dur * 100) + '%';
      if (w.t >= w.dur) {
        a.work = null; a.bar.style.display = 'none'; a.screen.material.emissive.setHex(0);
        w.done();
      }
    } else if (!a.busy && a !== ceo && (a.idleT -= dt) < 0) {
      a.idleT = 5 + Math.random() * 8;
      if (Math.random() < 0.5) go(a, a.seat);
      else go(a, V(-10 + Math.random() * 20, 4 + Math.random() * 4)).then(() => !a.busy && Math.random() < 0.6 && say(a, CHAT[Math.random() * CHAT.length | 0]));
    }
  }
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
});
</script>
</body>
</html>
